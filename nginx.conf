worker_processes auto;
events { worker_connections 4096; }
http {
  upstream api { server api:8000; keepalive 64; }       # Docker DNS round-robins across all replicas
  gzip on; gzip_types application/json text/csv text/css application/javascript;
  server {
    listen 80;
    location / {
      proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_next_upstream error timeout http_502 http_503; proxy_read_timeout 10s;
    }
  }
}
