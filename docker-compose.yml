# docker compose up --build        -> http://localhost:8080 (nginx -> 2 API replicas)
# docker compose up --scale api=4  -> horizontal scale-out, no code changes
services:
  api:
    build: .
    environment:
      WEB_CONCURRENCY: "2"
    volumes:
      - stream:/data/stream          # shared append-only store for streamed validations (all replicas read it)
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "2", memory: 2g}
    restart: unless-stopped
  lb:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  stream: {}
